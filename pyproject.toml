[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geosentinel"
version = "0.1.0"
description = "Research framework for explainable geospatial representation learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "shapely>=2.0,<3.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
geosentinel-validate-aoi = "geosentinel.aoi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
